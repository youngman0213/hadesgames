<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>하데스 키우기 v25.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --bg2: #0e0e1a;
  --card: #13131f;
  --card2: #1a1a28;
  --card3: #222235;
  --point: #e8407a;
  --point2: #b82d5e;
  --point-glow: rgba(232,64,122,0.18);
  --text: #f0f0fa;
  --text2: #8888aa;
  --text3: #555570;
  --border: #252538;
  --border2: #1e1e30;
  --success: #2ecc8e;
  --danger: #ff4d6d;
  --warn: #f4a22d;
  --info: #4d9fff;
  --vocal: #ff7eb3;
  --dance: #b06eff;
  --visual: #5bb8ff;
  --variety: #ffd166;
  --charm: #ff8c55;
  --money: #2ecc8e;
  --r-color: #aaaacc;
  --sr-color: #7eb8ff;
  --ssr-color: #ffcc44;
  --ur-color: #ff6bcd;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ── 노이즈 오버레이 ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* ══════════════════════════════
   시작 화면
══════════════════════════════ */
#start-page {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10000; text-align: center; overflow: hidden;
}
.start-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,64,122,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,64,122,0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridDrift 20s linear infinite;
}
@keyframes gridDrift { 0%{transform:translate(0,0)} 100%{transform:translate(48px,48px)} }
.start-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: orbFloat 8s ease-in-out infinite;
}
.start-orb1 { width:400px; height:400px; background:rgba(232,64,122,0.12); top:-100px; left:-100px; }
.start-orb2 { width:300px; height:300px; background:rgba(100,80,255,0.1); bottom:-80px; right:-80px; animation-delay:-4s; }
@keyframes orbFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.start-logo {
  font-family: 'Syne', sans-serif;
  font-size: clamp(4rem, 12vw, 7rem);
  font-weight: 800;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, #ff6bcd 0%, #e8407a 40%, #ff8c55 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px rgba(232,64,122,0.4));
  position: relative; z-index: 1;
  animation: logoReveal 1s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes logoReveal { from{opacity:0;transform:scale(0.8) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
.start-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.4em;
  color: var(--text2); margin: 12px 0 48px;
  text-transform: uppercase; position: relative; z-index: 1;
  animation: fadeUp 1s 0.3s both;
}
.start-btn {
  padding: 16px 60px;
  background: var(--point);
  color: white; border: none; border-radius: 2px;
  font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: 0.15em;
  cursor: pointer; position: relative; z-index: 1;
  transition: all 0.25s;
  box-shadow: 0 0 40px rgba(232,64,122,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  animation: fadeUp 1s 0.5s both;
  text-transform: uppercase;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
}
.start-btn:hover { background:var(--point2); transform:translateY(-3px); box-shadow:0 8px 50px rgba(232,64,122,0.5); }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.version-tag {
  position: absolute; bottom: 24px; right: 24px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text3); z-index: 1;
}

/* ══════════════════════════════
   네비게이션
══════════════════════════════ */
.nav-bar {
  display: none;
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 200;
}
.nav-inner {
  display: flex; max-width: 1100px; margin: 0 auto;
  padding: 0 16px; overflow-x: auto;
  scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav-btn {
  flex-shrink: 0;
  padding: 14px 14px;
  border: none; background: transparent;
  color: var(--text2); cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 11px;
  transition: 0.2s; white-space: nowrap;
  letter-spacing: 0.08em;
  border-bottom: 2px solid transparent;
  text-transform: uppercase;
  position: relative;
}
.nav-btn::after {
  content: ''; position: absolute;
  bottom: 0; left: 50%; right: 50%;
  height: 2px; background: var(--point);
  transition: 0.2s;
}
.nav-btn.active { color: var(--text); }
.nav-btn.active::after { left: 0; right: 0; }
.nav-btn:hover { color: var(--text); }

/* ══════════════════════════════
   레이아웃
══════════════════════════════ */
.container {
  display: none; max-width: 1100px;
  margin: 0 auto; padding: 20px 16px 100px;
  position: relative; z-index: 1;
}
.page { display: none; animation: pageIn 0.3s cubic-bezier(0.16,1,0.3,1); }
.page.active { display: block; }
@keyframes pageIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* PC 2단 레이아웃 */
.two-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 768px) { .two-col { grid-template-columns: 1fr 1fr; } }
.three-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .three-col { grid-template-columns: repeat(3, 1fr); } }

/* ══════════════════════════════
   카드 컴포넌트
══════════════════════════════ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 20px; border-radius: 12px;
  margin-bottom: 16px; position: relative;
  overflow: hidden;
}
.card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(232,64,122,0.3), transparent);
}
.card-glow { box-shadow: 0 0 30px var(--point-glow), 0 4px 20px rgba(0,0,0,0.3); }

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.2em;
  color: var(--text2); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: ''; display: block;
  width: 2px; height: 12px;
  background: var(--point); border-radius: 1px;
  box-shadow: 0 0 8px var(--point);
}

/* ══════════════════════════════
   홈 - 상태
══════════════════════════════ */
.status-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 20px;
}
.date-block .day-count {
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  background: linear-gradient(135deg, var(--point), #ff8c55);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.date-block .real-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text2); margin-top: 2px;
}
.tier-badge-small {
  padding: 5px 14px; border-radius: 2px;
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .stat-grid { grid-template-columns: repeat(6, 1fr); } }
.stat-item {
  background: var(--card2); padding: 12px;
  border-radius: 8px; border: 1px solid var(--border2);
  transition: border-color 0.2s;
}
.stat-item:hover { border-color: var(--border); }
.stat-item small {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text2);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.stat-item strong { font-size: 13px; display: block; margin-top: 4px; font-weight: 700; }

/* 팬덤 등급 표시 */
.fandom-tier-row {
  display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;
}
.fandom-tier-item {
  flex: 1; min-width: 80px;
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 8px;
  font-size: 11px; text-align: center;
}
.fandom-tier-item .ft-label { color: var(--text2); font-size: 9px; }
.fandom-tier-item .ft-val { font-weight: 700; margin-top: 2px; }

/* ══════════════════════════════
   경고 배너
══════════════════════════════ */
.warning-banner {
  background: rgba(255,77,109,0.08);
  border: 1px solid rgba(255,77,109,0.25);
  border-left: 3px solid var(--danger);
  border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: #ff8a9a;
  margin-bottom: 16px; display: none;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

/* ══════════════════════════════
   티커
══════════════════════════════ */
.ticker-container {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 10px 0; overflow: hidden;
  border-radius: 8px; margin-bottom: 16px;
  position: relative;
}
.ticker-label {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--point); color: white;
  font-family: 'Syne', sans-serif;
  font-size: 9px; font-weight: 700;
  padding: 0 12px; display: flex; align-items: center;
  letter-spacing: 0.15em; z-index: 2;
  white-space: nowrap;
}
.ticker-label::after {
  content: ''; position: absolute; right: -8px; top: 0; bottom: 0;
  width: 16px;
  background: linear-gradient(90deg, var(--point), transparent);
}
.ticker-mask { overflow: hidden; padding-left: 68px; }
.ticker-wrapper {
  display: inline-block; padding-left: 100%;
  animation: ticker 50s linear infinite; white-space: nowrap;
}
.ticker-item { display: inline-block; padding: 0 28px; font-size: 12px; color: var(--text2); }
.ticker-site {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 2px;
  margin-right: 8px; vertical-align: middle;
}
@keyframes ticker { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-100%,0,0)} }
.site-ebem { background:rgba(25,113,194,0.2); color:#74c0fc; }
.site-cafe { background:rgba(214,51,108,0.2); color:#f783ac; }
.site-sns { background:rgba(64,93,230,0.2); color:#748ffc; }
.site-yt { background:rgba(255,0,0,0.2); color:#ff8787; }
.site-yz { background:rgba(255,255,255,0.08); color:#ced4da; }
.site-news { background:rgba(255,92,92,0.2); color:#ff8787; }
.site-music { background:rgba(12,166,120,0.2); color:#63e6be; }

/* ══════════════════════════════
   차트
══════════════════════════════ */
.chart-tabs {
  display: flex; gap: 4px;
  background: var(--card2); padding: 5px;
  border-radius: 8px; margin-bottom: 12px;
}
.chart-tab-btn {
  flex: 1; border: none; background: transparent;
  padding: 8px; cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--text2); border-radius: 5px; transition: 0.2s;
}
.chart-tab-btn.active { background: var(--card3); color: var(--text); }
.sub-chart-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.sub-tab-btn {
  flex: 1; border: 1px solid var(--border2);
  background: transparent; padding: 7px;
  cursor: pointer; font-size: 11px; font-family: 'Syne', sans-serif;
  color: var(--text2); border-radius: 6px; transition: 0.2s;
  font-weight: 700;
}
.sub-tab-btn.active { background: var(--border); color: var(--text); border-color: var(--border); }
.sub-tab-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.chart-row {
  display: flex; align-items: center;
  padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 12px; transition: background 0.15s;
}
.chart-row:hover { background: rgba(255,255,255,0.02); }
.chart-row.my-song {
  background: rgba(232,64,122,0.08);
  border-radius: 6px;
  border: 1px solid rgba(232,64,122,0.3);
  border-left: 4px solid var(--point);
  box-shadow: 0 0 18px rgba(232,64,122,0.12);
  margin-bottom: 3px;
}
.rank { width: 28px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; text-align: center; margin-right: 8px; color: var(--text2); }
.chart-row:nth-child(1) .rank { color: #ffd43b; text-shadow: 0 0 8px rgba(255,212,59,0.5); }
.chart-row:nth-child(2) .rank { color: #c9d1d9; }
.chart-row:nth-child(3) .rank { color: #da77f2; }
.rank-change { width: 28px; font-size: 10px; text-align: center; margin-right: 4px; font-family: 'JetBrains Mono', monospace; }
.rank-up { color: var(--danger); }
.rank-down { color: var(--info); }
.song-info { flex: 1; overflow: hidden; }
.song-title { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist-name { font-size: 10px; color: var(--text2); }
.chart-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(232,64,122,0.14);
  color: var(--point);
}
.chart-not-enough { text-align: center; padding: 24px; color: var(--text2); font-size: 12px; }

/* ══════════════════════════════
   기록/시상식
══════════════════════════════ */
.record-list { display: grid; gap: 8px; }
.record-row {
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
}
.record-row.done { opacity: 0.72; }
.record-title { font-weight: 700; color: var(--text); }
.record-meta {
  margin-top: 3px;
  color: var(--text2);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
}
.career-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (min-width: 720px) { .career-grid { grid-template-columns: repeat(4, 1fr); } }
.career-item {
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 12px;
}
.career-item small {
  display: block;
  color: var(--text2);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 4px;
}
.career-item strong { font-size: 14px; }

/* ══════════════════════════════
   리포트 카드
══════════════════════════════ */
.report-card {
  background: rgba(46,204,142,0.05);
  border: 1px solid rgba(46,204,142,0.2);
  border-radius: 10px; padding: 14px;
  margin-bottom: 16px; display: none;
}

/* ══════════════════════════════
   멤버 카드
══════════════════════════════ */
.member-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 600px) { .member-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .member-grid { grid-template-columns: repeat(3, 1fr); } }

.member-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; position: relative;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.member-card:hover { border-color: rgba(232,64,122,0.3); box-shadow: 0 4px 20px rgba(232,64,122,0.08); }
.member-card.overload { border-color: rgba(255,77,109,0.4); background: rgba(255,77,109,0.03); }
.member-card.injured { border-color: rgba(244,162,45,0.4); }

.profile-container { display: flex; align-items: center; margin-bottom: 14px; gap: 14px; }
.profile-img {
  width: 60px; height: 60px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--border);
  background: var(--card2);
  transition: border-color 0.2s;
}
.member-card:hover .profile-img { border-color: var(--point); }
.profile-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; }
.profile-birth { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text2); margin-top: 3px; }
.profile-trait {
  display: inline-block; margin-top: 5px;
  font-size: 10px; padding: 3px 8px;
  border-radius: 3px; font-weight: 700;
  font-family: 'Syne', sans-serif; letter-spacing: 0.05em;
}

.stat-row { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
.stat-label { width: 38px; color: var(--text2); font-size: 9px; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
.stat-bar-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; margin: 0 8px; }
.stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }
.bonus-stat { color: var(--success); font-weight: 700; font... (truncated for brevity)

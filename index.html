<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>하데스 키우기 v25.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --bg2: #0e0e1a;
  --card: #13131f;
  --card2: #1a1a28;
  --card3: #222235;
  --point: #e8407a;
  --point2: #b82d5e;
  --point-glow: rgba(232,64,122,0.18);
  --text: #f0f0fa;
  --text2: #8888aa;
  --text3: #555570;
  --border: #252538;
  --border2: #1e1e30;
  --success: #2ecc8e;
  --danger: #ff4d6d;
  --warn: #f4a22d;
  --info: #4d9fff;
  --vocal: #ff7eb3;
  --dance: #b06eff;
  --visual: #5bb8ff;
  --variety: #ffd166;
  --charm: #ff8c55;
  --money: #2ecc8e;
  --r-color: #aaaacc;
  --sr-color: #7eb8ff;
  --ssr-color: #ffcc44;
  --ur-color: #ff6bcd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}
/* ── 노이즈 오버레이 ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
}
/* ══════════════════════════════
   시작 화면
══════════════════════════════ */
#start-page {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10000; text-align: center; overflow: hidden;
}
.start-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,64,122,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,64,122,0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridDrift 20s linear infinite;
}
@keyframes gridDrift { 0%{transform:translate(0,0)} 100%{transform:translate(48px,48px)} }
.start-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: orbFloat 8s ease-in-out infinite;
}
.start-orb1 { width:400px; height:400px; background:rgba(232,64,122,0.12); top:-100px; left:-100px; }
.start-orb2 { width:300px; height:300px; background:rgba(100,80,255,0.1); bottom:-80px; right:-80px; animation-delay:-4s; }
@keyframes orbFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.start-logo {
  font-family: 'Syne', sans-serif;
  font-size: clamp(4rem, 12vw, 7rem);
  font-weight: 800;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, #ff6bcd 0%, #e8407a 40%, #ff8c55 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px rgba(232,64,122,0.4));
  position: relative; z-index: 1;
  animation: logoReveal 1s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes logoReveal { from{opacity:0;transform:scale(0.8) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
.start-sub {
